<svg width="820" height="880" viewBox="0 0 820 880" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UML class diagram</title>
<desc>Class diagram showing User as base class extended by Student and Company, with Job, Application, and Interview relationships</desc>
<defs>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
<path d="M1 1 L11 6 L1 11 Z" fill="#ffffff" stroke="#444441" stroke-width="1"/>
</marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="820" height="880" fill="#ffffff"/>

<!-- User -->
<rect x="300" y="20" width="220" height="150" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="410" y="40" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#042C53">User</text>
<line x1="300" y1="48" x2="520" y2="48" stroke="#185FA5" stroke-width="1"/>
<text x="310" y="66" font-family="Arial" font-size="12" fill="#0C447C">+ id: Long</text>
<text x="310" y="82" font-family="Arial" font-size="12" fill="#0C447C">+ name: String</text>
<text x="310" y="98" font-family="Arial" font-size="12" fill="#0C447C">+ email: String</text>
<text x="310" y="114" font-family="Arial" font-size="12" fill="#0C447C">+ role: Role</text>
<line x1="300" y1="122" x2="520" y2="122" stroke="#185FA5" stroke-width="1"/>
<text x="310" y="140" font-family="Arial" font-size="12" fill="#0C447C">+ login()</text>
<text x="310" y="156" font-family="Arial" font-size="12" fill="#0C447C">+ register()</text>

<!-- Student -->
<rect x="60" y="260" width="240" height="170" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="180" y="280" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#04342C">Student</text>
<line x1="60" y1="288" x2="300" y2="288" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="306" font-family="Arial" font-size="12" fill="#085041">+ userId: Long</text>
<text x="70" y="322" font-family="Arial" font-size="12" fill="#085041">+ resumeId: Long</text>
<text x="70" y="338" font-family="Arial" font-size="12" fill="#085041">+ skills: String</text>
<line x1="60" y1="346" x2="300" y2="346" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="364" font-family="Arial" font-size="12" fill="#085041">+ applyForJob()</text>
<text x="70" y="380" font-family="Arial" font-size="12" fill="#085041">+ uploadResume()</text>

<!-- Company -->
<rect x="540" y="260" width="240" height="170" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="660" y="280" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#04342C">Company</text>
<line x1="540" y1="288" x2="780" y2="288" stroke="#0F6E56" stroke-width="1"/>
<text x="550" y="306" font-family="Arial" font-size="12" fill="#085041">+ userId: Long</text>
<text x="550" y="322" font-family="Arial" font-size="12" fill="#085041">+ industry: String</text>
<text x="550" y="338" font-family="Arial" font-size="12" fill="#085041">+ verified: boolean</text>
<line x1="540" y1="346" x2="780" y2="346" stroke="#0F6E56" stroke-width="1"/>
<text x="550" y="364" font-family="Arial" font-size="12" fill="#085041">+ postJob()</text>
<text x="550" y="380" font-family="Arial" font-size="12" fill="#085041">+ manageApplicants()</text>

<!-- Job -->
<rect x="540" y="470" width="240" height="180" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="660" y="490" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#412402">Job</text>
<line x1="540" y1="498" x2="780" y2="498" stroke="#854F0B" stroke-width="1"/>
<text x="550" y="516" font-family="Arial" font-size="12" fill="#633806">+ companyId: Long</text>
<text x="550" y="532" font-family="Arial" font-size="12" fill="#633806">+ title: String</text>
<text x="550" y="548" font-family="Arial" font-size="12" fill="#633806">+ stipend: Double</text>
<text x="550" y="564" font-family="Arial" font-size="12" fill="#633806">+ status: JobStatus</text>
<line x1="540" y1="572" x2="780" y2="572" stroke="#854F0B" stroke-width="1"/>
<text x="550" y="590" font-family="Arial" font-size="12" fill="#633806">+ postJob()</text>
<text x="550" y="606" font-family="Arial" font-size="12" fill="#633806">+ updateJob()</text>

<!-- Application -->
<rect x="260" y="470" width="240" height="180" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="380" y="490" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#412402">Application</text>
<line x1="260" y1="498" x2="500" y2="498" stroke="#854F0B" stroke-width="1"/>
<text x="270" y="516" font-family="Arial" font-size="12" fill="#633806">+ studentId: Long</text>
<text x="270" y="532" font-family="Arial" font-size="12" fill="#633806">+ jobId: Long</text>
<text x="270" y="548" font-family="Arial" font-size="12" fill="#633806">+ status: AppStatus</text>
<text x="270" y="564" font-family="Arial" font-size="12" fill="#633806">+ appliedAt: DateTime</text>
<line x1="260" y1="572" x2="500" y2="572" stroke="#854F0B" stroke-width="1"/>
<text x="270" y="590" font-family="Arial" font-size="12" fill="#633806">+ apply()</text>
<text x="270" y="606" font-family="Arial" font-size="12" fill="#633806">+ updateStatus()</text>

<!-- Interview -->
<rect x="260" y="700" width="240" height="160" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="380" y="720" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#4B1528">Interview</text>
<line x1="260" y1="728" x2="500" y2="728" stroke="#993556" stroke-width="1"/>
<text x="270" y="746" font-family="Arial" font-size="12" fill="#72243E">+ applicationId: Long</text>
<text x="270" y="762" font-family="Arial" font-size="12" fill="#72243E">+ scheduledAt: DateTime</text>
<text x="270" y="778" font-family="Arial" font-size="12" fill="#72243E">+ mode: String</text>
<text x="270" y="794" font-family="Arial" font-size="12" fill="#72243E">+ status: String</text>
<line x1="260" y1="802" x2="500" y2="802" stroke="#993556" stroke-width="1"/>
<text x="270" y="820" font-family="Arial" font-size="12" fill="#72243E">+ schedule()</text>

<!-- connectors -->
<line x1="230" y1="260" x2="360" y2="170" stroke="#444441" stroke-width="1.2" marker-end="url(#tri)"/>
<line x1="600" y1="260" x2="450" y2="170" stroke="#444441" stroke-width="1.2" marker-end="url(#tri)"/>

<line x1="660" y1="430" x2="660" y2="470" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="670" y="454" font-family="Arial" font-size="11" fill="#5F5E5A">posts</text>

<line x1="260" y1="345" x2="500" y2="490" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="330" y="420" font-family="Arial" font-size="11" fill="#5F5E5A">submits</text>

<line x1="540" y1="560" x2="500" y2="560" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="502" y="552" font-family="Arial" font-size="11" fill="#5F5E5A">receives</text>

<line x1="380" y1="650" x2="380" y2="700" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="390" y="678" font-family="Arial" font-size="11" fill="#5F5E5A">leads to</text>
</svg>
