<svg width="900" height="820" viewBox="0 0 900 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Entity relationship diagram</title>
<desc>ER schema showing USER, STUDENT, COMPANY, JOB, APPLICATION, INTERVIEW, and RESUME tables and their foreign key relationships</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="900" height="820" fill="#ffffff"/>

<!-- USER -->
<rect x="330" y="20" width="240" height="130" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26215C">USER</text>
<line x1="330" y1="48" x2="570" y2="48" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="66" font-family="Arial" font-size="12" fill="#3C3489">PK  id</text>
<text x="340" y="82" font-family="Arial" font-size="12" fill="#3C3489">name</text>
<text x="340" y="98" font-family="Arial" font-size="12" fill="#3C3489">email</text>
<text x="340" y="114" font-family="Arial" font-size="12" fill="#3C3489">password</text>
<text x="340" y="130" font-family="Arial" font-size="12" fill="#3C3489">role</text>

<!-- STUDENT -->
<rect x="60" y="240" width="240" height="110" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="180" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#04342C">STUDENT</text>
<line x1="60" y1="268" x2="300" y2="268" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="286" font-family="Arial" font-size="12" fill="#085041">PK  id</text>
<text x="70" y="302" font-family="Arial" font-size="12" fill="#085041">FK  user_id</text>
<text x="70" y="318" font-family="Arial" font-size="12" fill="#085041">FK  resume_id</text>
<text x="70" y="334" font-family="Arial" font-size="12" fill="#085041">skills</text>

<!-- COMPANY -->
<rect x="600" y="240" width="240" height="110" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="720" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#04342C">COMPANY</text>
<line x1="600" y1="268" x2="840" y2="268" stroke="#0F6E56" stroke-width="1"/>
<text x="610" y="286" font-family="Arial" font-size="12" fill="#085041">PK  id</text>
<text x="610" y="302" font-family="Arial" font-size="12" fill="#085041">FK  user_id</text>
<text x="610" y="318" font-family="Arial" font-size="12" fill="#085041">industry</text>
<text x="610" y="334" font-family="Arial" font-size="12" fill="#085041">verified</text>

<!-- RESUME -->
<rect x="20" y="420" width="220" height="100" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="130" y="440" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#4A1B0C">RESUME</text>
<line x1="20" y1="448" x2="240" y2="448" stroke="#993C1D" stroke-width="1"/>
<text x="30" y="466" font-family="Arial" font-size="12" fill="#712B13">PK  id</text>
<text x="30" y="482" font-family="Arial" font-size="12" fill="#712B13">FK  student_id</text>
<text x="30" y="498" font-family="Arial" font-size="12" fill="#712B13">file_url</text>

<!-- JOB -->
<rect x="600" y="420" width="240" height="130" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="720" y="440" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#412402">JOB</text>
<line x1="600" y1="448" x2="840" y2="448" stroke="#854F0B" stroke-width="1"/>
<text x="610" y="466" font-family="Arial" font-size="12" fill="#633806">PK  id</text>
<text x="610" y="482" font-family="Arial" font-size="12" fill="#633806">FK  company_id</text>
<text x="610" y="498" font-family="Arial" font-size="12" fill="#633806">title, description</text>
<text x="610" y="514" font-family="Arial" font-size="12" fill="#633806">stipend, deadline</text>
<text x="610" y="530" font-family="Arial" font-size="12" fill="#633806">status</text>

<!-- APPLICATION -->
<rect x="300" y="440" width="240" height="130" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="420" y="460" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#4B1528">APPLICATION</text>
<line x1="300" y1="468" x2="540" y2="468" stroke="#993556" stroke-width="1"/>
<text x="310" y="486" font-family="Arial" font-size="12" fill="#72243E">PK  id</text>
<text x="310" y="502" font-family="Arial" font-size="12" fill="#72243E">FK  student_id</text>
<text x="310" y="518" font-family="Arial" font-size="12" fill="#72243E">FK  job_id</text>
<text x="310" y="534" font-family="Arial" font-size="12" fill="#72243E">status, applied_at</text>

<!-- INTERVIEW -->
<rect x="300" y="640" width="240" height="120" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="420" y="660" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#501313">INTERVIEW</text>
<line x1="300" y1="668" x2="540" y2="668" stroke="#A32D2D" stroke-width="1"/>
<text x="310" y="686" font-family="Arial" font-size="12" fill="#791F1F">PK  id</text>
<text x="310" y="702" font-family="Arial" font-size="12" fill="#791F1F">FK  application_id</text>
<text x="310" y="718" font-family="Arial" font-size="12" fill="#791F1F">scheduled_at, mode</text>
<text x="310" y="734" font-family="Arial" font-size="12" fill="#791F1F">status</text>

<!-- connectors -->
<line x1="330" y1="90" x2="200" y2="240" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="230" y="170" font-family="Arial" font-size="11" fill="#5F5E5A">is (1:1)</text>

<line x1="570" y1="90" x2="700" y2="240" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="600" y="170" font-family="Arial" font-size="11" fill="#5F5E5A">is (1:1)</text>

<line x1="150" y1="350" x2="140" y2="420" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="150" y="390" font-family="Arial" font-size="11" fill="#5F5E5A">has</text>

<line x1="720" y1="350" x2="720" y2="420" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="730" y="390" font-family="Arial" font-size="11" fill="#5F5E5A">posts (1:N)</text>

<line x1="220" y1="330" x2="360" y2="440" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="230" y="400" font-family="Arial" font-size="11" fill="#5F5E5A">submits (1:N)</text>

<line x1="640" y1="440" x2="540" y2="470" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="545" y="450" font-family="Arial" font-size="11" fill="#5F5E5A">receives (1:N)</text>

<line x1="420" y1="570" x2="420" y2="640" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow3)"/>
<text x="430" y="610" font-family="Arial" font-size="11" fill="#5F5E5A">leads_to (1:1)</text>
</svg>
