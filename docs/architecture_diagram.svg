<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>System architecture diagram</title>
<desc>Three-tier architecture: React frontend, Spring Boot backend with six services, and PostgreSQL database</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="480" fill="#ffffff"/>

<rect x="230" y="20" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Student / Company / Admin</text>
<line x1="340" y1="64" x2="340" y2="96" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="96" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53">React frontend</text>
<text x="340" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">REST API (HTTPS)</text>
<line x1="340" y1="140" x2="340" y2="176" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="176" width="520" height="220" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="100" y="202" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Spring Boot backend</text>

<rect x="110" y="220" width="220" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="220" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#04342C">Authentication service</text>

<rect x="350" y="220" width="220" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="460" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#04342C">Student service</text>

<rect x="110" y="272" width="220" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="220" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#04342C">Company service</text>

<rect x="350" y="272" width="220" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="460" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#04342C">Job / Application service</text>

<rect x="110" y="324" width="220" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="220" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#04342C">Interview service</text>

<rect x="350" y="324" width="220" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="460" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#04342C">Notification service</text>

<line x1="340" y1="396" x2="340" y2="420" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230" y="420" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">PostgreSQL database</text>
</svg>
